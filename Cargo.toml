[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
license = "MIT"
repository = "https://github.com/jyurkiw/mudparty"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
base64 = "0.22.1"
jiff = "0.2.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
# Only in tests, to check files against the schemas; no fetching of remote schemas.
jsonschema = { version = "0.49.9", default-features = false }
toml = "1.1.8"
serde_norway = "0.9.42"
sha2 = "0.11.1"
notify = "8.2.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }
anyhow = "1.0.104"
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
regex = "1.13.1"
insta = "1.49.0"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
# The version axum 0.8 uses, so the tests' WebSocket client builds no second copy.
tokio-tungstenite = "0.29.0"
# Pinned to jyurkiw/silvermere main (PR #13 merged). Move the pin deliberately: the
# catalogue test (design §10.2) then shows what text changed.
silvermere-text = { git = "https://github.com/jyurkiw/silvermere", rev = "8aebd91b52af66a1c4f77ab7c0458d1d1965bb7a" }
silvermere-types = { git = "https://github.com/jyurkiw/silvermere", rev = "8aebd91b52af66a1c4f77ab7c0458d1d1965bb7a" }
silvermere = { git = "https://github.com/jyurkiw/silvermere", rev = "8aebd91b52af66a1c4f77ab7c0458d1d1965bb7a" }
silvermere-db = { git = "https://github.com/jyurkiw/silvermere", rev = "8aebd91b52af66a1c4f77ab7c0458d1d1965bb7a" }
silvermere-engine = { git = "https://github.com/jyurkiw/silvermere", rev = "8aebd91b52af66a1c4f77ab7c0458d1d1965bb7a" }
silvermere-import = { git = "https://github.com/jyurkiw/silvermere", rev = "8aebd91b52af66a1c4f77ab7c0458d1d1965bb7a" }
silvermere-testkit = { git = "https://github.com/jyurkiw/silvermere", rev = "8aebd91b52af66a1c4f77ab7c0458d1d1965bb7a" }
silvermere-auth = { git = "https://github.com/jyurkiw/silvermere", rev = "8aebd91b52af66a1c4f77ab7c0458d1d1965bb7a" }
