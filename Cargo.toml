[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
license = "MIT"
repository = "https://github.com/jyurkiw/mudparty"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
base64 = "0.22.1"
jiff = "0.2.38"
serde_json = "1.0.154"
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
