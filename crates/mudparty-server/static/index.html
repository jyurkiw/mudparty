<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mudparty</title>
<style>
  :root {
    --bg: #f4f4f1; --card: #fff; --ink: #1d1d1b; --dim: #6b6b66; --line: #dcdcd6;
    --hp: #3a8f4a; --mp: #3e6fb8; --warn: #b8542e; --chip: #ecece6; --on: #2f6f3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #20201e; --ink: #e8e8e3; --dim: #9a9a93; --line: #34342f;
      --hp: #4fae60; --mp: #5b8ad6; --warn: #e07a50; --chip: #2c2c29; --on: #5fbf6e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; gap: 16px; align-items: baseline; padding: 12px 16px;
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  #link { color: var(--dim); }
  #link.down { color: var(--warn); }
  #result { margin-left: auto; color: var(--dim); }
  #result.bad { color: var(--warn); }
  main { display: grid; gap: 12px; padding: 16px;
         grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
          padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .card.main { border-color: var(--mp); }
  .top { display: flex; align-items: baseline; gap: 8px; }
  .name { font-weight: 600; font-size: 15px; }
  .class, .note { color: var(--dim); }
  .mode { margin-left: auto; padding: 1px 8px; border-radius: 10px; background: var(--chip); }
  .mode.fighting { color: var(--warn); }
  .mode.offline { color: var(--dim); }
  .bar { height: 14px; background: var(--chip); border-radius: 3px; position: relative;
         overflow: hidden; }
  .bar > i { position: absolute; inset: 0 auto 0 0; }
  .bar.hp > i { background: var(--hp); }
  .bar.mp > i { background: var(--mp); }
  .bar > span { position: relative; font-size: 11px; padding-left: 4px; line-height: 14px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .badge { color: var(--warn); }
  button { font: inherit; padding: 2px 8px; border: 1px solid var(--line);
           background: var(--chip); color: var(--ink); border-radius: 4px; cursor: pointer; }
  button.on { border-color: var(--on); color: var(--on); }
  button:disabled { opacity: .45; cursor: default; }
  input { font: inherit; padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px;
          background: var(--card); color: var(--ink); flex: 1; min-width: 0; }
  ol { margin: 0; padding-left: 18px; color: var(--dim); font-size: 12px;
       font-family: ui-monospace, Consolas, monospace; }
  ol li { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<header>
  <h1>mudparty</h1>
  <span id="link">connecting…</span>
  <span id="server" class="note"></span>
  <span id="result"></span>
</header>
<main id="party"></main>
<script>
"use strict";
let ws;
const party = document.getElementById("party");
const link = document.getElementById("link");
const result = document.getElementById("result");

function order(name, fields) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(Object.assign({ v: 1, type: "order", name }, fields)));
  }
}

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}

function bar(kind, cur, max) {
  if (cur == null) return null;
  const pct = max ? Math.max(0, Math.min(100, (cur * 100) / max)) : 100;
  const fill = el("i");
  fill.style.width = pct + "%";
  return el("div", { class: "bar " + kind }, fill,
    el("span", {}, `${kind.toUpperCase()} ${cur}${max ? "/" + max : ""}`));
}

// A text box with a button; Enter sends it too.
function box(placeholder, label, send, disabled) {
  const input = el("input", { placeholder, disabled });
  const go = () => { if (input.value.trim()) { send(input.value); input.value = ""; } };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  return el("div", { class: "row" }, input, el("button", { onclick: go, disabled }, label));
}

// Where a character was last recorded, for a rescue.
function lastSeen(p) {
  const room = `${p.room_name || "???"} (map ${p.map}, room ${p.room})`;
  const hp = p.hp == null ? "" : ` · HP ${p.hp}${p.max_hp ? "/" + p.max_hp : ""}`;
  const when = new Date(p.at).toLocaleString();
  return `last seen: ${room}${hp} · ${p.why} · ${when}`;
}

function card(m) {
  const inGame = ["idle", "fighting", "resting", "waiting"].includes(m.mode);
  const a = m.automation;
  const toggle = (sw, on, label) => el("button", {
    class: on ? "on" : "", disabled: !inGame,
    onclick: () => order(m.name, { order: "toggle", switch: sw, on: !on }),
  }, `${label} ${on ? "on" : "off"}`);
  const room = m.room
    ? `${m.room.name || "???"} (map ${m.room.map}, room ${m.room.room})`
    : "room unknown";
  const fight = m.target ? `${m.target}${m.tier ? " — " + m.tier : ""}` : null;
  const badges = [];
  if (m.config_error) badges.push(el("div", { class: "badge" }, "config error: " + m.config_error));
  if (m.offline && !m.running) badges.push(el("div", { class: "note" }, m.offline));
  if (a.held_by.length) badges.push(el("div", { class: "note" }, "held by " + a.held_by.join(", ")));
  if (a.all_off) badges.push(el("div", { class: "note" }, "all engines off"));
  if (a.stopped) badges.push(el("div", { class: "note" }, "stopped (@stop)"));

  const seated = m.driver === "seat";
  const controls = seated ? [
    el("div", { class: "note" },
      "Playing in MudPlay. A line sent from here waits for any line you're typing there."),
    box("command for the game", "Send", (t) => order(m.name, { order: "command", text: t }), !inGame),
    m.queued.length ? el("div", { class: "note" }, "queued: " + m.queued.join(" · ")) : null,
  ] : (m.bot || m.driver === "unattended") ? [
    el("div", { class: "row" },
      el("button", { disabled: m.running, onclick: () => order(m.name, { order: "start" }) }, "Start"),
      el("button", { disabled: !m.running, onclick: () => order(m.name, { order: "stop" }) }, "Stop"),
      el("button", { disabled: !inGame, onclick: () => order(m.name, { order: "wait" }) }, "Wait"),
      el("button", { disabled: !inGame, onclick: () => order(m.name, { order: "ok" }) }, "Ok"),
      a.stopped
        ? el("button", { disabled: !inGame, onclick: () => order(m.name, { order: "resume" }) }, "Go on")
        : el("button", { disabled: !inGame, onclick: () => order(m.name, { order: "pause" }) }, "Pause")),
    el("div", { class: "row" },
      toggle("combat", a.combat, "combat"), toggle("nuke", a.nuke, "nuke"),
      toggle("rest", a.rest, "rest"), toggle("all", !a.all_off, "all")),
    box("monster", "Kill", (t) => order(m.name, { order: "kill", target: t }), !inGame),
    box("room, like 1/2141", "Go", (t) => order(m.name, { order: "goto", room: t }), !inGame),
    box("command for the game", "Send", (t) => order(m.name, { order: "command", text: t }), !inGame),
  ] : [el("div", { class: "note" },
    m.main ? "Played in MudPlay, through the proxy." : "No login: can't run as a bot.")];

  return el("section", { class: "card" + (m.main ? " main" : "") },
    el("div", { class: "top" },
      el("span", { class: "name" }, m.name),
      el("span", { class: "class" }, [m.class, m.main ? "main" : null].filter(Boolean).join(" · ")),
      el("span", { class: "mode " + m.mode }, m.mode.replace("_", " "))),
    m.vitals ? bar("hp", m.vitals.hp, m.vitals.max_hp) : null,
    m.vitals ? bar("mp", m.vitals.mp, m.vitals.max_mp) : null,
    el("div", {}, room),
    fight ? el("div", {}, "fighting " + fight) : null,
    m.party ? el("div", { class: "note" }, "party: " + m.party) : null,
    m.routine ? el("div", { class: "note" }, "routine: " + m.routine) : null,
    m.walk ? el("div", { class: "note" }, m.walk) : null,
    m.driver === "unattended" ? el("div", { class: "note" }, "MudPlay left: staying online, idle") : null,
    m.last_position ? el("div", { class: "note" }, lastSeen(m.last_position)) : null,
    ...badges,
    ...controls,
    m.events.length ? el("ol", {}, ...m.events.map((e) => el("li", {}, e))) : null);
}

function render(msg) {
  // Keep what's half-typed in a box across a redraw.
  const typed = [...party.querySelectorAll("input")].map((i) => i.value);
  const focus = [...party.querySelectorAll("input")].indexOf(document.activeElement);
  party.replaceChildren(...msg.members.map(card));
  const inputs = party.querySelectorAll("input");
  typed.forEach((v, i) => { if (inputs[i]) inputs[i].value = v; });
  if (focus >= 0 && inputs[focus]) inputs[focus].focus();
  const running = msg.server.running;
  document.getElementById("server").textContent =
    running.length ? "running: " + running.join(", ") : "no bots running";
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws/ui`);
  ws.onopen = () => { link.textContent = "connected"; link.className = ""; };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "party") render(msg);
    else if (msg.type === "result") {
      result.textContent = `${msg.name}: ${msg.message}`;
      result.className = msg.ok ? "" : "bad";
    }
  };
  ws.onclose = () => {
    link.textContent = "server gone; retrying"; link.className = "down";
    setTimeout(connect, 2000);
  };
}
connect();
</script>
</body>
</html>
