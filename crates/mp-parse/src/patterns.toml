# The lines mudparty knows (design §10.2).
#
# Each [[pattern]] reads one shape of line, as plain text (ANSI removed), the whole line:
#
#   event   the mp_parse::Event variant it builds
#   keys    the silvermere catalogue entries it reads: silvermere-text/messages/catalogue.toml,
#           or `auth:` for silvermere-auth/messages/auth.toml. The catalogue test renders each
#           one and checks this pattern reads it.
#   re      the regex; each named group fills the event field of the same name
#   numbers groups read as numbers
#   split   groups split into a list, with the separator given
#
# The first matching entry wins, so a narrower shape goes before a wider one it also fits.

# ----- login --------------------------------------------------------------------------

[[pattern]]
event = "UsernamePrompt"
keys = ["auth:username_prompt"]
re = '^Username: ?$'

[[pattern]]
event = "PasswordPrompt"
keys = ["auth:password_prompt"]
re = '^Password: ?$'

[[pattern]]
event = "InvalidCredentials"
keys = ["auth:invalid_credentials"]
re = '^Invalid Credentials$'

[[pattern]]
event = "AccountLocked"
keys = ["auth:account_locked"]
re = '^Too many failed logins: this account is locked for (?P<minutes>\d+) more minute\(s\)\.$'
numbers = ["minutes"]

[[pattern]]
event = "DuplicateLogin"
keys = ["auth:duplicate_login", "auth:takeover_prompt"]
re = '^This account is already logged on\.$'

[[pattern]]
event = "TakeoverQuestion"
keys = ["auth:takeover_question", "auth:takeover_prompt"]
re = '^Disconnect the other connection and log in here\? \(Y/N\): ?$'

[[pattern]]
event = "TakeoverFailed"
keys = ["auth:takeover_failed"]
re = '^The other connection did not close in time\. Please try again in a minute\.$'

[[pattern]]
event = "TakenOver"
keys = ["auth:taken_over"]
re = '^This account has logged on from another connection\. Disconnecting\.$'

[[pattern]]
event = "NoPassword"
keys = ["auth:no_password"]
re = '^This account has no password yet\. Ask the sysop to set one\.$'

[[pattern]]
event = "MainMenu"
keys = ["bbs_menu"]
re = '^Make your selection \(X to exit\): ?$'

[[pattern]]
event = "MudMenu"
keys = ["mud_menu_prompt"]
re = '^\[MAJORMUD\]: ?$'

# ----- combat -------------------------------------------------------------------------

[[pattern]]
event = "CombatEngaged"
keys = ["combat_engaged", "combat_engaged_split"]
re = '^\*Combat Engaged\*$'

[[pattern]]
event = "CombatOff"
keys = ["combat_off"]
re = '^\*Combat Off\*$'

# Before the general `moves to attack` shape, which these two also fit.
[[pattern]]
event = "AttacksRoom"
keys = ["cast_attacks_room"]
re = '^(?P<who>\S+) moves to attack everyone in the room\.$'

[[pattern]]
event = "AttacksYou"
keys = ["combat_moves_to_attack_you", "cast_moves_to_attack_you"]
re = '^(?P<who>\S+) moves to attack you!$'

[[pattern]]
event = "MovesToAttack"
keys = ["combat_moves_to_attack_mon", "cast_moves_to_attack", "combat_moves_to_attack_other"]
re = '^(?P<who>\S+) moves to attack (?P<target>.+)[.!]$'

[[pattern]]
event = "MovesToCast"
keys = ["cast_moves_to_cast"]
re = '^(?P<who>\S+) moves to cast (?P<spell>.+) upon (?P<target>.+)\.$'

[[pattern]]
event = "SpellNoEffect"
keys = ["cast_no_effect_on"]
re = '^Your spell has no effect on (?P<target>.+)\.$'

[[pattern]]
event = "WeaponNoEffect"
keys = ["combat_no_effect_weapon"]
re = '^Your weapon has no effect against this monster!$'

[[pattern]]
event = "ExpGain"
keys = ["exp_gain"]
re = '^You gain (?P<exp>\d+) experience\.$'
numbers = ["exp"]

# A kill that gains nothing, since the character holds all the experience it may without
# training (silvermere progression/experience.rs `add_experience`); in place of ExpGain.
[[pattern]]
event = "ExpCapped"
keys = ["exp_capped"]
re = '^You have progressed too far without training to acquire anymore experience!$'

# A monster leaving the room (silvermere's own words; a player's leave line is the same
# shape once its anti-script bytes are gone, and a roster of monsters ignores it).
[[pattern]]
event = "Left"
keys = ["monster_left_up", "monster_left_down", "monster_left_dir"]
re = '^(?P<who>.+) just left (?:upwards|downwards|to the \w+)\.$'

[[pattern]]
event = "AlsoHere"
keys = ["room_also_here"]
re = '^Also here: (?P<names>.+)\.$'
split = { names = ", " }

# The fork's stealth casters (silvermere design/stealth-casters.md).
[[pattern]]
event = "StrikeFromShadows"
keys = ["spell_backstab_lead_in"]
re = '^You strike from the shadows with (?P<spell>.+)!$'

[[pattern]]
event = "StrikesFromShadows"
keys = ["spell_backstab_lead_in_room"]
re = '^(?P<who>\S+) strikes from the shadows with (?P<spell>.+)!$'

[[pattern]]
event = "SpottedCasting"
keys = ["spell_backstab_spotted"]
re = '^Your foe spots you as you begin to cast!$'

# ----- leaving the realm --------------------------------------------------------------

# The line is followed by the wait's row of dots, which carries no event.
[[pattern]]
event = "ExitStarted"
keys = ["exit_meditate"]
re = '^You will exit after a period of silent meditation\.$'

[[pattern]]
event = "ExitInterrupted"
keys = ["exit_interrupted"]
re = '^\.*Your meditation has been interrupted - you may not exit now!$'

[[pattern]]
event = "ExitWaiting"
keys = ["exit_waiting"]
re = '^\.*You may not perform any commands while waiting to exit!$'

[[pattern]]
event = "MortallyWounded"
keys = ["exit_wounded", "mortally_wounded"]
re = '^You may not (?:exit MajorMud|do that) while you are mortally wounded!$'

# ----- talk and pacing ----------------------------------------------------------------

[[pattern]]
event = "Telepath"
keys = ["telepath"]
re = '^(?P<who>\S+) telepaths: (?P<text>.*)$'

[[pattern]]
event = "Gangpath"
keys = ["gang_paths"]
re = '^(?P<who>\S+) gangpaths: (?P<text>.*)$'

[[pattern]]
event = "TelepathSent"
keys = ["telepath_sent"]
re = '^--- Telepath Sent to (?P<who>.+) ---$'

[[pattern]]
event = "TelepathNotSent"
keys = ["telepath_not_sent"]
re = '^--- Telepath Not Sent ---$'

[[pattern]]
event = "UserUnknown"
keys = ["user_unknown"]
re = '^Cannot find user!$'

[[pattern]]
event = "TooFast"
keys = ["too_fast"]
re = '^You are typing too quickly - command ignored$'

[[pattern]]
event = "SlowDown"
keys = ["slow_down"]
re = "^Why don't you slow down for a few seconds\\?$"

# ----- party --------------------------------------------------------------------------

[[pattern]]
event = "InvitedYouFollow"
keys = ["invited_you_follow"]
re = '^(?P<who>\S+) has invited you to follow \S+\.$'

[[pattern]]
event = "YouInvitedFollow"
keys = ["you_invited_follow"]
re = '^You have invited (?P<who>.+) to follow you\.$'

[[pattern]]
event = "NowFollowing"
keys = ["now_following"]
re = '^You are now following (?P<who>\S+)$'

[[pattern]]
event = "StartedFollow"
keys = ["started_follow"]
re = '^(?P<who>\S+) started to follow you\.$'

[[pattern]]
event = "NoLongerFollowing"
keys = ["no_longer_following"]
re = '^You are no longer following (?P<who>\S+)\.$'

[[pattern]]
event = "FollowerRemoved"
keys = ["follower_removed"]
re = '^(?P<who>\S+) has been removed from your followers\.$'

[[pattern]]
event = "InviteFirst"
keys = ["invite_first"]
re = '^You must be invited first!$'

[[pattern]]
event = "FollowNothing"
keys = ["follow_nothing"]
re = "^You don't see that anywhere!$"

[[pattern]]
event = "NotHere"
keys = ["gang_not_here"]
re = "^You don't see (?P<who>.+) here!$"

[[pattern]]
event = "CannotInvite"
keys = ["gang_invite_forgotten"]
re = '^You cannot invite (?P<who>.+)\.$'

[[pattern]]
event = "PartyHeader"
keys = ["party_header"]
re = '^The following people are in your travel party:$'

[[pattern]]
event = "PartyFollowing"
keys = ["party_following"]
re = '^You are following (?P<who>\S+)\.$'

# `  %-30.30s %-12.12s` then ` [M:%3.3s%]` (K for kai) or nine spaces, ` [H:%3.3s%]`, P or a
# space, R / M or a space, and the rank (silvermere display/party.rs). PartyRow's own
# deserializers trim the padding and read the letters.
[[pattern]]
event = "PartyRow"
keys = ["party_row"]
re = '^  (?P<name>.{30}) (?P<class>.{12})(?: \[[MK]:(?P<mp_pct> *-?\d+)%\]| {9}) \[H:(?P<hp_pct> *-?\d+)%\](?P<poisoned>[P ])(?P<rest>[RM ]) - (?P<rank>Frontrank|Backrank|Midrank)$'
numbers = ["mp_pct", "hp_pct"]

[[pattern]]
event = "PartyRowInvited"
keys = ["party_row_invited"]
re = '^  (?P<name>.{30}) (?P<class>.{12}) \[Invited\]$'

[[pattern]]
event = "PartyNone"
keys = ["party_none"]
re = '^You are not in a party at the present time\.$'

# ----- resting ------------------------------------------------------------------------

[[pattern]]
event = "RestStarted"
keys = ["rest_start", "meditate_start"]
re = '^You are now (?:resting|meditating)\.$'

[[pattern]]
event = "TooSick"
keys = ["rest_sick", "meditate_sick"]
re = '^You are too sick to (?:rest|meditate)!$'

[[pattern]]
event = "MeditateUseless"
keys = ["meditate_useless"]
re = '^Meditation will not help at this time\.$'

[[pattern]]
event = "PoisonTick"
keys = ["poison_tick"]
re = '^You feel ill\.$'

# ----- shops and gear (#55) -------------------------------------------------------------

# The price is ` <n> <coin>` words, or ` Free`; only the item matters.
[[pattern]]
event = "Bought"
keys = ["shop_bought"]
re = '^You just bought (?P<item>.+) for.*\.$'

[[pattern]]
event = "CannotAfford"
keys = ["shop_cannot_afford"]
re = '^You cannot afford (?P<item>.+)\.$'

[[pattern]]
event = "BuyRefused"
keys = ["shop_unknown", "shop_cannot_buy", "carry_too_much"]
re = '^(?P<text>.+ is not a known item\.|You cannot buy .+ here!|You cannot carry that much!)$'

[[pattern]]
event = "Equipped"
keys = ["wield_ok", "wear_ok"]
re = '^You are now (?:holding|wearing) (?P<item>.+)\.$'

# LIGHT <item> (silvermere commands/inventory.rs `cmd_light`): a light source lit is put
# to use as a worn item is.
[[pattern]]
event = "Equipped"
keys = ["light_ok"]
re = '^You lit the (?P<item>.+)\.$'

[[pattern]]
event = "EquipRefused"
keys = ["wear_no_room", "wear_forbidden", "weapon_forbidden", "wear_not_have_any"]
re = '^(?P<text>You have no more room to wear that item!|You may not wear that item!|You may not use that weapon\.|You do not have any .+\.)$'

[[pattern]]
event = "EquipRefused"
keys = ["light_forbidden", "already_lit", "cannot_light", "light_recharge"]
re = '^(?P<text>You may not light that item!|You already have something lit!|You cannot light .+!|You must recharge that before you may light it again\.)$'

# INVENTORY: the carried list (wrapped at 79 columns, so it may run onto the next lines),
# the keys line, `Wealth:` and `Encumbrance:` (silvermere display/inventory.rs). Nothing!
# comes first, since the list's own pattern would read it too.
[[pattern]]
event = "CarryingNothing"
keys = ["inv_carrying_nothing"]
re = '^You are carrying Nothing!$'

[[pattern]]
event = "Carrying"
keys = ["inv_carrying"]
re = '^You are carrying (?P<items>.+)$'

[[pattern]]
event = "KeysLine"
keys = ["inv_keys_list", "keys_none"]
re = '^You have (?:no keys\.|the following keys: .*\.)$'

[[pattern]]
event = "Wealth"
keys = ["inv_wealth"]
re = '^Wealth: (?P<copper>\d+) '
numbers = ["copper"]

# ----- training (#56) -----------------------------------------------------------------

# The fee is ` <n> <coin>` words, or ` nothing`; only the level matters.
[[pattern]]
event = "Trained"
keys = ["trained"]
re = '^You hand over.* and you receive training to attain level (?P<level>\d+)\.$'
numbers = ["level"]

[[pattern]]
event = "TrainNoExp"
keys = ["train_no_exp"]
re = '^You do not have the required experience to train yet!$'

[[pattern]]
event = "TrainNoMoney"
keys = ["train_no_money"]
re = '^You do not have the money required for your training\.$'

[[pattern]]
event = "TrainRefused"
keys = ["train_wrong_room", "train_wrong_class", "train_too_low", "train_too_high", "train_tournament"]
re = '^(?P<text>You must be in an appropriate training room to train!|This shop is not suitable for your training\.|You have (?:not )?progressed (?:far enough|too far) to use the training provided here\.|You may not do any training while in tournament mode!)$'

# ----- where and how far --------------------------------------------------------------

# `/room` answers with the bare key through the fork's text line; a `/room <dir>` with no
# exit that way says `*no room found*`, which this doesn't read.
[[pattern]]
event = "RoomKey"
keys = ["fork_text"]
re = '^(?P<map>\d+)/(?P<room>\d+)$'
numbers = ["map", "room"]

# ----- moving ---------------------------------------------------------------------------

# The line wraps when the exits are many; its start is enough to know the move arrived.
[[pattern]]
event = "ObviousExits"
keys = ["room_exits", "room_exits_none", "exits_list", "exits_list_none"]
re = '^Obvious exits: '

[[pattern]]
event = "NoExit"
keys = ["no_exit", "no_exit_clr"]
re = '^There is no exit in that direction!$'

[[pattern]]
event = "DoorClosed"
keys = ["door_closed", "door_closed_locked", "gate_closed", "gate_closed_locked", "exit_key_closed"]
re = '^(?:The (?:door|gate) is [Cc]losed!|There is a closed door in that direction!)$'

[[pattern]]
event = "DoorOpened"
keys = ["door_now_open", "door_was_open"]
re = '^The \S+ (?:is now open|was already open)\.$'

[[pattern]]
event = "DoorLocked"
keys = ["door_is_locked"]
re = '^The \S+ is locked\.$'

[[pattern]]
event = "BashedOpen"
keys = ["bash_ok"]
re = '^You bashed the \S+ open\.$'

[[pattern]]
event = "BashFailed"
keys = ["bash_fail"]
re = '^Your attempts to bash through fail!$'

[[pattern]]
event = "ExitRefused"
keys = ["exit_level_low", "exit_level_high", "exit_forbidden", "exit_timed_closed", "exit_need_spell", "exit_need_item"]
re = '^(?P<text>You (?:have not progressed far enough to go through this exit!|have progressed too far to go through this exit!|may not go through this exit!|may not pass through that exit at this point in time\.|need to cast a spell to go that way!|do not have the appropriate item to go that direction!))$'

# The row's value starts after exactly nine spaces, so a template that starts with a space
# keeps it.
[[pattern]]
event = "ProfileStatline"
keys = ["profile_statline"]
re = '^Statusline: {9}(?P<mode>.+)$'

# exp, left and need are `%lu`, or `%lu%09lu` past a billion: digits either way.
[[pattern]]
event = "ExpLine"
keys = ["exp_line"]
re = '^Exp: (?P<exp>\d+) Level: (?P<level>\d+) Exp needed for next level: (?P<left>\d+) \((?P<need>\d+)\) \[(?P<pct>\d+)%\]$'
numbers = ["exp", "level", "left", "need", "pct"]
